<!doctype html>
<!-- The ground, before a single byte of CSS or JS: the board's dark as the
     lens shows it (run/lens.js lifts the darks a hair, warm: rgb(27, 25, 23)),
     so the first painted pixel and the run's first frame are one colour and
     nothing changes when that frame lands. An inline style outranks the
     stylesheet, so this is the one that decides; styles.css says the same. -->
<html lang="en" style="background: #1b1917">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
