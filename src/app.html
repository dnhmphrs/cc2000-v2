<!doctype html>
<!-- The ground, before a single byte of CSS or JS: the blue-black the three
     3D scenes paint (0x090b14, the deep backdrop's colour1), so the first
     painted pixel and the first WebGL frame are the same colour and the
     canvas fading in over it changes nothing. It was the warm AIR of the
     WebGL run (config/palette.js), which showed as a yellowish black for as
     long as the warm-up took and then went blue as the canvas arrived. An
     inline style outranks the stylesheet, so this is the one that decides. -->
<html lang="en" style="background: #090b14">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
